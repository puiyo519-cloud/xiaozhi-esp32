name: Build EmoHalo 1.85

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py waveshare_esp32_s3_touch_lcd_1_85

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: emohalo_firmware
          path: build/merged-binary.bin
